<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Cart - Online Plant Nursery</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
    .total { font-weight: bold; }
    .btn { padding: 10px 20px; background-color: green; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>🛒 Your Cart</h2>
  <table id="cartTable">
    <thead>
      <tr>
        <th>Plant Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3 class="total">Total: ₹<span id="totalAmount">0</span></h3>
  <button class="btn" onclick="checkout()">Proceed to Checkout</button>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderCart() {
      let tbody = document.querySelector("#cartTable tbody");
      let total = 0;
      tbody.innerHTML = "";

      cart.forEach((item, index) => {
        let subtotal = item.price * item.qty;
        total += subtotal;

        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>₹${item.price}</td>
            <td>${item.qty}</td>
            <td>₹${subtotal}</td>
            <td><button onclick="removeItem(${index})">❌</button></td>
          </tr>
        `;
      });

      document.getElementById("totalAmount").innerText = total;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    function checkout() {
      alert("Thank you for your order! (Dummy checkout)");
      localStorage.removeItem("cart");
      location.reload();
    }

    renderCart();
  </script>

</body>
</html>
