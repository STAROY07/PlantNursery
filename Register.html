<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Plant Nursery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: url('Images/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 50, 0, 0.45);
            z-index: -1;
        }

        .register-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px 30px;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            width: 360px;
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2e7d32;
            font-weight: 700;
        }

        .register-container label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 0.9rem;
        }

        .register-container input[type="text"],
        .register-container input[type="email"],
        .register-container input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.3s;
        }

        .register-container input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 8px rgba(46,125,50,0.3);
        }

        .register-container input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #2e7d32, #4caf50);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-container input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(46,125,50,0.4);
        }

        .register-container p {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #333;
        }

        .register-container p a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }

        .register-container p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h2><i class="fa-solid fa-seedling"></i> Create Account</h2>
    <form method="POST" action="Register.html" id="registerForm">
        <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>

        <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>

        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <input type="submit" value="Register">
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
    <p style="margin-top: 8px;"><a href="index.html">← Back to Home</a></p>
</div>

<script src="js/main.js"></script>
</body>
</html>
