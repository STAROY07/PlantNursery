
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4fff4;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2a7a2a;
        }
        .cart-container {
            max-width: 900px;
            margin: auto;
        }
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid #cceccc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.05);
        }
        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }
        .cart-details {
            flex-grow: 1;
            margin-left: 15px;
        }
        .cart-details h3 {
            margin: 0;
        }
        .cart-details p {
            margin: 5px 0;
        }
        .quantity {
            width: 50px;
            padding: 5px;
        }
        .remove-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .cart-summary {
            text-align: right;
            margin-top: 30px;
        }
        .cart-summary h2 {
            color: #2a7a2a;
        }
        .checkout-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Your Shopping Cart</h1>
    <div class="cart-container">

        <div class="cart-item">
            <img src="rose.jpg" alt="Rose Plant">
            <div class="cart-details">
                <h3>Rose Plant</h3>
                <p>Price: ₹499</p>
                <label>Qty: <input type="number" value="1" class="quantity" min="1"></label>
            </div>
            <button class="remove-btn">Remove</button>
        </div>

        <div class="cart-item">
            <img src="money_plant.jpg" alt="Money Plant">
            <div class="cart-details">
                <h3>Money Plant</h3>
                <p>Price: ₹299</p>
                <label>Qty: <input type="number" value="2" class="quantity" min="1"></label>
            </div>
            <button class="remove-btn">Remove</button>
        </div>

        <div class="cart-item">
            <img src="tulsi.jpg" alt="Tulsi Plant">
            <div class="cart-details">
                <h3>Tulsi Plant</h3>
                <p>Price: ₹199</p>
                <label>Qty: <input type="number" value="1" class="quantity" min="1"></label>
            </div>
            <button class="remove-btn">Remove</button>
        </div>

        <div class="cart-summary">
            <h2>Total: ₹1296</h2>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>

    </div>
</body>
</html>
